<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Encryption Vault</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #020617;
            color: white;
            overflow: hidden;
            min-height: 100vh;
        }
        /* MATRIX */
        
        #matrix {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }
        /* GRID */
        
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(0, 255, 136, .05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 136, .05) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 10s linear infinite;
        }
        
        @keyframes gridMove {
            from {
                transform: translateY(0);
            }
            to {
                transform: translateY(40px);
            }
        }
        /* GLOWS */
        
        .glow {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: .15;
            background: #00ff88;
            z-index: 0;
            animation: float 8s ease-in-out infinite;
        }
        
        .glow2 {
            right: 0;
            bottom: 0;
            background: #00aaff;
        }
        
        @keyframes float {
            0%,
            100% {
                transform: translate(0, 0);
            }
            50% {
                transform: translate(80px, -80px);
            }
        }
        /* PAGE */
        
        .page {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .card {
            width: 180%;
            max-width: 1000px;
            background: rgba(15, 23, 42, .8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 255, 136, .25);
            border-radius: 25px;
            padding: 30px;
            box-shadow: 0 0 40px rgba(0, 255, 136, .15);
        }
        
        h1,
        h2 {
            text-align: center;
            color: #00ff88;
            margin-bottom: 15px;
            text-shadow: 0 0 15px #00ff88;
        }
        
        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 25px;
        }
        
        textarea,
        input {
            width: 100%;
            padding: 14px;
            margin: 10px 0;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 136, .25);
            background: #0f172a;
            color: white;
            outline: none;
        }
        
        textarea {
            resize: vertical;
        }
        
        .buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }
        
        button {
            flex: 1;
            min-width: 80px;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s;
        }
        
        button:hover {
            transform: translateY(-3px);
        }
        
        .encryptBtn {
            background: #00ff88;
            color: black;
        }
        
        .decryptBtn {
            background: #00aaff;
            color: white;
        }
        
        .backBtn {
            background: #334155;
            color: white;
        }
        
        .copyBtn {
            background: #f59e0b;
            color: white;
        }
        
        .output {
            margin-top: 20px;
            padding: 15px;
            min-height: 120px;
            background: #0f172a;
            border-radius: 12px;
            border: 1px solid rgba(0, 255, 136, .25);
            word-break: break-all;
        }
        
        .hidden {
            display: none;
        }
        
        .homeBtns {
            display: grid;
            gap: 15px;
            margin-top: 30px;
        }
        
        .homeBtns button {
            font-size: 18px;
        }
        
        .footer {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
        }
    </style>
</head>

<body><canvas id="matrix"></canvas>

    <div class="glow"></div>
    <div class="glow glow2"></div>
    <!-- HOME PAGE -->
    <div class="page" id="homePage">
        <div class="card">
            <h1>🔐 Cyber Encryption Vault</h1>
            <p class="subtitle">
                Secure Encryption System
            </p>
            <div class="homeBtns"><button class="encryptBtn" onclick="showPage('encryptPage')">
Encrypt Text
</button>

                <button class="decryptBtn" onclick="showPage('decryptPage')">
Decrypt Text
</button>

            </div>
            <div class="footer">
                Cyber Security Encryption Dashboard
            </div>
        </div>
    </div>
    <!-- ENCRYPT PAGE -->
    <div class="page hidden" id="encryptPage">
        <div class="card">
            <h2>Encryption Center</h2><textarea id="encryptInput" rows="7" placeholder="Enter text to encrypt">
</textarea><input type="password" id="encryptKey" placeholder="Enter Secret Key">

            <div class="buttons"><button class="encryptBtn" onclick="encryptText()">
Encrypt
</button>

                <button class="copyBtn" onclick="copyEncryptOutput()">
Copy
</button>

                <button class="decryptBtn" onclick="showHistory()">
        History
    </button>

                <button class="backBtn" onclick="goHome()">
Back
</button>

            </div>
            <div class="output" id="encryptResult">
                Encrypted text will appear here...
            </div>
        </div>
    </div>
    <!-- DECRYPT PAGE -->
    <div class="page hidden" id="decryptPage">
        <div class="card">
            <h2>Decryption Center</h2><textarea id="decryptInput" rows="7" placeholder="Paste encrypted text">
</textarea><input type="password" id="decryptKey" placeholder="Enter Secret Key">

            <div class="buttons"><button class="decryptBtn" onclick="decryptText()">
Decrypt
</button>

                <button class="copyBtn" onclick="copyDecryptOutput()">
Copy
</button>

                <button class="encryptBtn" onclick="showHistory()">
         History
    </button>

                <button class="backBtn" onclick="goHome()">
Back
</button>

            </div>
            <div class="output" id="decryptResult">
                Decrypted text will appear here...
            </div>
        </div>
    </div>

    <div class="page hidden" id="historyPage">
        <div class="card">

            <h2>📜 Encryption / Decryption History</h2>

            <div id="historyList" class="output" style="max-height:450px;overflow:auto;">
            </div>

            <div class="buttons">
                <button class="copyBtn" onclick="clearHistory()">
                Delete History
            </button>

                <button class="backBtn" onclick="goHome()">
                Back
            </button>
            </div>

        </div>
    </div>
    <script>
        /* history page */

        function saveHistory(type, text) {
            let history = JSON.parse(localStorage.getItem("history")) || [];

            history.unshift({
                type: type,
                text: text,
                time: new Date().toLocaleString()
            });

            localStorage.setItem("history", JSON.stringify(history));
        }

        function loadHistory() {
            let history = JSON.parse(localStorage.getItem("history")) || [];

            let html = "";

            if (history.length === 0) {
                html = "No history found.";
            } else {
                history.forEach(item => {
                    html += `
                <div style="margin-bottom:15px;padding:10px;border-bottom:1px solid #444">
                    <b>${item.type}</b><br>
                    <small>${item.time}</small><br><br>
                    ${item.text}
                </div>
            `;
                });
            }

            document.getElementById("historyList").innerHTML = html;
        }

        function clearHistory() {
            localStorage.removeItem("history");
            loadHistory();
        }

        function showHistory() {

            document.getElementById("homePage").classList.add("hidden");
            document.getElementById("encryptPage").classList.add("hidden");
            document.getElementById("decryptPage").classList.add("hidden");

            document.getElementById("historyPage").classList.remove("hidden");

            loadHistory();
        }

        /* PAGE NAVIGATION */

        function showPage(page) {

            document.getElementById("homePage")
                .classList.add("hidden");

            document.getElementById("encryptPage")
                .classList.add("hidden");

            document.getElementById("decryptPage")
                .classList.add("hidden");

            document.getElementById(page)
                .classList.remove("hidden");
        }

        function goHome() {

            document.getElementById("encryptPage")
                .classList.add("hidden");

            document.getElementById("decryptPage")
                .classList.add("hidden");

            document.getElementById("homePage")
                .classList.remove("hidden");

            document.getElementById("historyPage").classList.add("hidden");
        }

        /* ENCRYPT */

        function encryptText() {

            const text = document.getElementById("encryptInput").value;
            const key = document.getElementById("encryptKey").value;

            if (!text || !key) {
                alert("Enter text and key");
                return;
            }

    // Random Salt
            const salt = CryptoJS.lib.WordArray.random(16);

    // Random IV
            const iv = CryptoJS.lib.WordArray.random(16);

    // Key Derivation using Salt
            const derivedKey = CryptoJS.PBKDF2(key, salt, {
                keySize: 256 / 32,
                iterations: 1000
            });

    // Encrypt
            const encrypted = CryptoJS.AES.encrypt(text, derivedKey, {
                iv: iv
            });

    // Store Salt + IV + Ciphertext
            const finalData =
                salt.toString() + ":" +
                iv.toString() + ":" +
                encrypted.toString();

            document.getElementById("encryptResult").innerText = finalData;

            saveHistory("Encrypted", finalData);
        }

        /* DECRYPT */

        function decryptText() {

            const encryptedData =
                document.getElementById("decryptInput").value;

            const key =
                document.getElementById("decryptKey").value;

            if (!encryptedData || !key) {
                alert("Enter encrypted text and key");
                return;
            }

            try {

                const parts = encryptedData.split(":");
 
                if (parts.length !== 3) {
                    throw new Error("Invalid format");
                }

                const salt = CryptoJS.enc.Hex.parse(parts[0]);
                const iv = CryptoJS.enc.Hex.parse(parts[1]);
                const cipherText = parts[2];

                const derivedKey = CryptoJS.PBKDF2(key, salt, {
                    keySize: 256 / 32,
                    iterations: 1000
                });

                const decrypted = CryptoJS.AES.decrypt(cipherText, derivedKey, {
                    iv: iv
                });

                const output = decrypted.toString(CryptoJS.enc.Utf8);

                if (!output) {
                    throw new Error("Wrong key");
                }

                document.getElementById("decryptResult").innerText = output;

                saveHistory("Decrypted", output);

            } catch (error) {

                document.getElementById("decryptResult").innerText =
                    "Invalid encrypted text or wrong key";
            }
        }
        /* COPY */

        function copyEncryptOutput() {

            navigator.clipboard.writeText(
                document.getElementById(
                    "encryptResult").innerText
            );
        }

        function copyDecryptOutput() {

            navigator.clipboard.writeText(
                document.getElementById(
                    "decryptResult").innerText
            );
        }

        /* MATRIX RAIN */

        const canvas =
            document.getElementById("matrix");

        const ctx =
            canvas.getContext("2d");

        canvas.width =
            window.innerWidth;

        canvas.height =
            window.innerHeight;

        const chars =
            "01ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%";

        const fontSize = 14;

        const columns =
            canvas.width / fontSize;

        const drops = [];

        for (let i = 0; i < columns; i++) {
            drops[i] = 1;
        }

        function matrix() {

            ctx.fillStyle =
                "rgba(2,6,23,0.08)";

            ctx.fillRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            ctx.fillStyle =
                "#00ff88";

            ctx.font =
                fontSize +
                "px monospace";

            for (let i = 0; i < drops.length; i++) {

                const text =
                    chars[
                        Math.floor(
                            Math.random() * chars.length
                        )
                    ];

                ctx.fillText(
                    text,
                    i * fontSize,
                    drops[i] * fontSize
                );

                if (
                    drops[i] * fontSize >
                    canvas.height &&
                    Math.random() > 0.975
                ) {
                    drops[i] = 0;
                }

                drops[i]++;
            }

            requestAnimationFrame(matrix);
        }

        matrix();

        window.addEventListener(
            "resize",
            () => {
                canvas.width =
                    window.innerWidth;

                canvas.height =
                    window.innerHeight;
            }
        );
    </script>
</body>

</html>
